name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Auto Fix Project Structure & Build APK
      run: |
        # Buat dummy project flutter jika belum lengkap
        flutter create temp_app
        cp -r temp_app/android ./ 2>/dev/null || true
        cp -r temp_app/ios ./ 2>/dev/null || true
        
        # Install dependency project
        flutter pub get
        
        # Build APK Release
        flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nutritrack-app-release
        path: build/app/outputs/flutter-apk/app-release.apk
